<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES-6</title>
    <script>
        /*without arrow*/
        function myFunction1() {
            document.write("This is the function executed..");
        }
        myFunction1();

        /*with arrow*/
        myFuntion = () => {
            document.write("This is the function with arrow is executed..");
        }
        myFuntion();
    </script>
</head>

<body>
    <h3>With Arrow</h3>
</body>

</html>
