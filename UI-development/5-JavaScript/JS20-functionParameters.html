</head>

<body>
    <h2>FunctionParameters</h2>
    <script>
        function addition(a, b) {
            var sum = a + b;
            document.write("<br>Addition: " + sum);
        }
        let t1 = 10;
        let t2 = 50
        addition(20, 15);
        addition(10.5, 20.4);
        addition(t1, t2);
    </script>
</body>
