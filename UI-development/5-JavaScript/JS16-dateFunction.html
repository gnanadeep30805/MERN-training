<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-16</title>
</head>

<body>
    <h2>HTML page</h2>
    <p id="myDate">.....</p>
    <button type="button" onclick="displayDate()">Date</button>

    <script>
        function displayDate() {
            document.getElementById("myDate").innerHTML = Date();
        }
    </script>
</body>

</html>
