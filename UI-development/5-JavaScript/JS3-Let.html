<body>
    <h1>Let</h1>
    <script>
        let a1 = 10;
        document.write("Number : ", a1);
        document.write("<br>");
        a1 = "hello";
        document.write("string : ", a1);
        document.write("<br>");
        a1 = 45.5;
        document.write("float: ", a1);
    </script>
