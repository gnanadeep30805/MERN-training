<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-7</title>
</head>

<body>
    <h2>JavaScript</h2>

    <script>
        let a = 100;
        let b = 200;
        let c = 300;
        if (a > b && a > c)
            document.write("a is big");
        else if (b > a && b > c)
            document.write("b is big");
        else
            document.write("c is big");
    </script>
</body>

</html>
