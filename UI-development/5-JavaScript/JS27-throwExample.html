<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-27</title>
    <script>
        function checkAge(age) {
            if (age <= 18) {
                throw new Error("Age should be more than 18");
            }
            else {
                return "Eligible for voting";
            }
        }

        try {
            let result = checkAge(2);
            document.write(result);
        }
        catch (error) {
            document.write("Program has error: " + error);
        }
        finally {
            document.write("<br>try throw");
        }


    </script>
</head>

<body>
    <h3>JavaScript Programming TryThrow</h3>
</body>

</html>
