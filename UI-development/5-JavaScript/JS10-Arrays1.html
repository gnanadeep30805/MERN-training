<body>
    <h3>Arrays-1</h3>
    <script>
        var arr = [10, 20, 30, 40, 50, 60];

        console.log(arr[1]);
        console.log(arr[2]);
        console.log(arr[3]);

            document.write(arr[i] + "<br>");
        }
    </script>
