<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <h1>Lists</h1>
    <h3>Order List</h3>
    <ol>
        <li>apple</li>
        <li>banana</li>
        <li>custard apple</li>
    </ol>
    <h3>Unordered List</h3>
    <ul>
        <li>avacado</li>
        <li>bitter guard</li>
    </ul>
    <br>
    <hr>
</body>

</html>
