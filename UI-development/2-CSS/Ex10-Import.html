<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import CSS file</title>
    <link rel="stylesheet" href="Ex10.2-Import.css">
    <style>
        h2 {
            background-color: antiquewhite;
            color: black;
        }

        .city {
            background-color: rgb(61, 61, 157);
            color: aliceblue;
        }

        .info {
            background-color: rgb(12, 92, 126);
            color: aliceblue;
            font-style: normal;
        }

        p {
            color: rgb(251, 16, 16);
            font-style: italic;
            background-color: aqua;
        }

        #id {
            background-color: black;
        }
    </style>
</head>

<body>
    <h2 id="id" class="city">London</h2>
    <h2 class="city">Paris</h2>
    <h2 class="city info">Tokyo</h2>
    <hr>
    <p>London is the capital of France</p>
    <p class="info">Paris is the capital of France</p>
    <p id="id">Tokyo is the capital of France</p>
</body>

</html>
