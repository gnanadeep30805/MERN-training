<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: aliceblue;
        }

        .gradientBox {
            height: 200px;
            width: 300px;
            background: linear-gradient(rgba(0, 149, 255, 0.8), rgb(208, 255, 0));
        }
    </style>
</head>

<body>
    <div class="gradientBox">
        <h2>Linear Gradient</h2>
        <p>Change the direction and colors</p>
    </div>
</body>

</html>
