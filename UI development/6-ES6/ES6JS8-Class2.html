<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES-8</title>
</head>

<body>
    <h1>JavaScript Classes</h1>

    <script>
        class Person {
            name;
            age;

            myDisplay() {
                console.log("Name: " + this.name);
                console.log("Age: " + this.age);
            }
        }

        var myPerson = new Person();
        myPerson.name = "ravi";
        myPerson.age = 26;
        myPerson.myDisplay();
    </script>
</body>

</html>
