<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            background-color: cadetblue;
        }

        table {
            background-color: black;
            color: white;
            border-color: azure;
        }
    </style>
</head>

<body>
    <h1>Tables</h1>
    <table border="7" cellpadding="20" cellspacing="0">
        <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Year</th>
        </tr>
        <tr>
            <td>Chaitanya</td>
            <td>572</td>
            <td>2nd year</td>
        </tr>
        <tr>
            <td>Nirmal</td>
            <td>583</td>
            <td>2nd year</td>
        </tr>
    </table>
</body>

</html>
