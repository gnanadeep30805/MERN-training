<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        a :hover {
            text-transform: uppercase;
            background-color: blue;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <h1>hover effect</h1>
    <a href="www.google.com">GOOGLE</a>
</body>

</html>
