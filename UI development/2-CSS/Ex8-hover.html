<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        a:link {
            color: rgb(139, 91, 91);
        }

        a:hover {
            text-transform: uppercase;
            font-size: 30px;
            background-color: rgb(4, 4, 29);
            color: rgb(255, 255, 255);
        }

        a:visited {
            color: rgb(85, 238, 29);
        }

        a:active {
            color: rgb(245, 0, 0);
        }
    </style>
</head>

<body>
    <h1>hover effect</h1>
    <a href="http://www.google.com">GOOGLE</a>
</body>

</html>
