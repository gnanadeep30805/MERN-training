<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .myInfo {
            background-color: aqua;
            padding: 20px;
        }

        @media screen and (min-width: 600px) {
            .myInfo {
                font-size: 80px;
                ;
            }
        }
    </style>
</head>

<body>
    <div class="myInfo">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ex voluptatibus quisquam quas odit expedita
        laudantium? Autem quae neque dicta impedit mollitia odit quasi ipsa. Iste accusamus maxime magni officiis
        facere.
    </div>
</body>

</html>
