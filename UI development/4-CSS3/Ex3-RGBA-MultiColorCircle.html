<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>
    <style>
        #div {
            width: 400px;
            height: 400px;
            background: radial-gradient(green, yellow, red);
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        .hello {
            width: 300px;
            height: 300px;
            background: radial-gradient(blue, rgba(22, 218, 22, 0.962), yellow);
        }
    </style>
</head>

<body>
    <div id="div">
    </div>
    <br>
    <h1>
        Welcome to CSS3- Mutli-color circle
    </h1><br>
    <div class="hello">
    </div>
</body>

</html>
