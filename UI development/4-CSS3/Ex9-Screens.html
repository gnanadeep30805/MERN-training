<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different screen size</title>
    <style>
        @media screen and (min-width:350px) {
            body {
                background-color: rgb(150, 19, 19);
            }
        }

        @media screen and (min-width:450px) and (max-width:1018px) {
            body {
                background-color: aqua;
            }
        }

        @media screen and (min-width:1224px) {
            body {
                background-color: rgb(150, 147, 19);
            }

        }

        @media screen and (min-width:1824px) {
            body {
                background-color: rgb(148, 48, 216);
            }
        }
    </style>
</head>

<body>

</body>

</html>
