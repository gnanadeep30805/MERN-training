<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-14</title>
</head>

<body>
    <h3>JavaScript Function</h3>

    <script>
        sum();
        document.write("<br>");
        sum(100, 200);

        function sum(a, b) {
            document.write("<br> 100 + 200 = ", a + b);
        }
    </script>
</body>

</html>
