<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-18</title>
    <script>
        function mouseOver() {
            document.write("hello mouse over....")
        }
    </script>
</head>

<body>
    <p>Bring you mouse inside</p>
    <div onmouseover=mouseOver()>
        <h2>this is inside the div tags</h2>
    </div>
</body>

</html>
