<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Validation</title>

    <script>
        function myFunction() {
            var x = document.getElementById("mycheck");
            x.checked = true

        }
    </script>
</head>

<body>

    <p>Checkbox validation</p> <input type="checkbox" id="mycheck">

    <p>Click me then True/False</p>
    <button onclick="myFunction()">ClickMe</button>
</body>

</html>
