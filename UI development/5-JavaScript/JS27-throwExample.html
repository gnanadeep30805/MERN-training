<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-27</title>
    <script>
        function checkAge(age) {
            if (age < 18) {
                throw new Error("You are not eligible for voting");
            }
            else {
                return "Eligible for voting";
            }

            try {
                let result = checkAge(2);
                document.write(result);
                if (age < 18) {
                    throw new Error("You are not eligible for voting");
                }
                document.write("Eligible for voting");
            }
            catch (error) {
                document.error("Program has error: " + error);
            }
        }

    </script>
</head>

<body>
    <h3>JavaScript Programming TryThrow</h3>
    <button onclick="checkAge(19)">Check Eligibility</button>
</body>

</html>
