<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-8</title>
</head>

<body>
    <h3>While Loop</h3>
    <script>
        /*without loops*/
        document.write("without while loop: <br>")
        let a = 1;
        document.write(a + "<br>");
        a++;
        document.write(a + "<br>");
        a++;
        document.write(a + "<br><br>");

        /*with while loop*/
        document.write("with while loop: <br>")
        let n = 10;
        while (n > 0) {
            document.write(n, "<br>");
            n--;
        }

        /*with do-while loop*/
        document.write("with do-while loop: <br>")
        let m = 10;
        do {
            document.write(m, "<br>");
            m--;
        } while (m > 0);
    </script>
</body>

</html>
