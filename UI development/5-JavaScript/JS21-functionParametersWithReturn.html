<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-21</title>
</head>

<body>
    <h2>FunctionParametersWithReturn</h2>
    <script>
        function multiply(a, b) {
            var product = a * b;
            return product;
        }
        let p1 = 5;
        let p2 = 10;
        let p;
        p = multiply(3, 5);
        document.write("<br>Product: " + p);
        p = multiply(p1, p2);
        document.write("<br>Product: " + p);
    </script>
</body>

</html>
