<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-12</title>
</head>

<body>
    <h3>Sort Arrays</h3>
    <script>
        /*Number sort*/
        document.write("<strong>Number sort:</strong> <br>");
        var arr = [10, 30, 20];
        document.write("Before sort: <br>")
        document.write(arr + "<br>");
        arr.sort();
        document.write("After sort: <br>");
        document.write(arr + "<br>");
        document.write("<br>")

        /*String sort*/
        document.write("<strong>String sort:</strong> <br>");
        var fruits = ["banana", "grape", "apple", "orange", "kiwi"];
        document.write("Before sort: <br>")
        document.write(fruits + "<br>");
        fruits.sort();
        document.write("After sort: <br>");
        document.write(fruits + "<br>");
        document.write("<br>")

        /*Reverse sort*/
        document.write("<strong>Reverse sort:</strong> <br>");
        fruits.reverse();
        document.write(fruits + "<br>");
    </script>
</body>

</html>
