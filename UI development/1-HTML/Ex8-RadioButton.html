<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button</title>
</head>

<body>
    <h1>Radio button</h1>
    What is pizza's size : <br>
    <input type="radio" name="size_of_pizza" value="S" id="">Small <br>
    <input type="radio" name="size_of_pizza" value="M" id="">Medium <br>
    <input type="radio" name="size_of_pizza" value="L" id="">Large <br>
    <br>
    <hr>
</body>

</html>
